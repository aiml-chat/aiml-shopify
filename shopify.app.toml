name = "AIML Chat"
client_id = "YOUR_SHOPIFY_PARTNER_CLIENT_ID"
application_url = "https://shopify.aiml.chat"
embedded = true
handle = "aiml-chat"

[build]
  automatically_update_urls_on_dev = true
  dev_store_url = "YOUR_DEV_STORE.myshopify.com"
  include_config_on_deploy = true

[access_scopes]
  scopes = "read_products,read_content,read_themes,write_themes,read_orders"

[auth]
  redirect_urls = [
    "https://shopify.aiml.chat/auth/callback",
    "https://shopify.aiml.chat/auth/shopify/callback",
    "https://shopify.aiml.chat/api/auth/callback",
  ]

[webhooks]
  api_version = "2024-07"

  [[webhooks.subscriptions]]
    topics = ["app/uninstalled"]
    uri = "/webhooks"

  [[webhooks.subscriptions]]
    topics = ["customers/data_request"]
    uri = "/webhooks/gdpr/customers_data_request"
    compliance_topics = true

  [[webhooks.subscriptions]]
    topics = ["customers/redact"]
    uri = "/webhooks/gdpr/customers_redact"
    compliance_topics = true

  [[webhooks.subscriptions]]
    topics = ["shop/redact"]
    uri = "/webhooks/gdpr/shop_redact"
    compliance_topics = true

[pos]
  embedded = false
